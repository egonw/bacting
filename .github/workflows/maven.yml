name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21, 25 ]
    name: Java ${{ matrix.java }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
    - name: Build with Maven
      run: mvn clean install -Dgpg.skip -Dmaven.javadoc.skip=true

  coverage:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - name: Build with Maven
      run: mvn clean install -Dgpg.skip -Dmaven.javadoc.skip=true -Dmaven.test.failure.ignore=true -Djunit5.excludeGroups=
    - name: Publish Test Report
      id: report
      uses: mikepenz/action-junit-report@v6
      if: success() || failure() # always run even if the previous step fails
      with:
        report_paths: 'core/target/surefire-reports/TEST-*.xml'
        comment: true
    - name: push JaCoCo stats to codecov.io
      uses: codecov/codecov-action@v7
      env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7
    - name: Submit Dependency Snapshot
      uses: advanced-security/maven-dependency-submission-action@v5
